# ─── Client (React + Nginx) Deployment ───────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-deployment
  namespace: festival-rush
  labels:
    app: client
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: 306601824447.dkr.ecr.ap-south-1.amazonaws.com/festival-rush-client:v7
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # nginx writes to /tmp and /var/cache
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
# ─── Client Service ──────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: client-service
  namespace: festival-rush
spec:
  type: LoadBalancer
  selector:
    app: client
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
