# ─── Ingress — Route traffic to client and server ────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: festival-rush-ingress
  namespace: festival-rush
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server-service
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-service
                port:
                  number: 80
