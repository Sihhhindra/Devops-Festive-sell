# ─── Ansible Inventory ───────────────────────────────────────────
# Update with your actual EC2 instance IPs/hostnames

[jenkins]
jenkins-server ansible_host=<JENKINS_EC2_IP> ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/festival-rush.pem

[build_nodes]
jenkins-server

[all:vars]
ansible_python_interpreter=/usr/bin/python3
